buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        constraints {
            // Patch transitive Android Gradle plugin dependencies on the build classpath.
            classpath 'com.google.guava:guava:33.7.2-jre'
            classpath 'org.apache.commons:commons-lang3:3.18.0'
            classpath 'org.apache.httpcomponents:httpclient:4.5.14'
            classpath 'org.bitbucket.b_c:jose4j:0.9.6'
            classpath 'org.bouncycastle:bcpkix-jdk18on:1.85'
            classpath 'org.bouncycastle:bcprov-jdk18on:1.85'
            classpath 'org.bouncycastle:bcutil-jdk18on:1.85'
            classpath 'org.jdom:jdom2:2.0.6.1'
        }
    }
}
plugins { id 'com.android.application' version '9.5.2' }
android {
    namespace 'arpa.homelab.pathblock'
    compileSdk 35
    defaultConfig {
        applicationId 'arpa.homelab.pathblock'
        minSdk 30
        targetSdk 35
        versionCode 26
        versionName '1.24'
        testInstrumentationRunner 'arpa.homelab.pathblock.RuleChecks'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.matching { it.name == 'androidLintTool' }.configureEach {
    // Lint resolves a separate tool classpath from the Android Gradle plugin.
    resolutionStrategy.force(
        'com.google.guava:guava:33.7.2-jre',
        'org.apache.commons:commons-lang3:3.18.0',
        'org.apache.httpcomponents:httpclient:4.5.14',
        'org.bouncycastle:bcpkix-jdk18on:1.85',
        'org.bouncycastle:bcprov-jdk18on:1.85',
        'org.bouncycastle:bcutil-jdk18on:1.85'
    )
}
